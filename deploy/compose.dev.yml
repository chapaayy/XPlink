name: xplink-dev
services:
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?create .env using scripts/init-dev.sh}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synapse -d synapse']
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]

  synapse:
    image: matrixdotorg/synapse:v1.163.0
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME:?set MATRIX_SERVER_NAME}
      SYNAPSE_REPORT_STATS: 'no'
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ../.local/synapse:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8008/_matrix/client/versions", timeout=3)'' || exit 1',
        ]
      interval: 8s
      timeout: 6s
      retries: 25
      start_period: 20s
    networks: [internal]

  # RTC media is forwarded by LiveKit; Matrix appservice controls JWT issuance.
  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ../.local/rtc/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '127.0.0.1:7881:7881/tcp'
      - '127.0.0.1:7882-7902:7882-7902/udp'
    networks: [internal]

  lk-jwt:
    image: ghcr.io/element-hq/lk-jwt-service:0.9.0
    user: "991:991"
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ws://xplink.localhost:8080/livekit/sfu
      LIVEKIT_KEY: xplinkrtc
      LIVEKIT_SECRET_FROM_FILE: /run/rtc/secret
      LIVEKIT_FULL_ACCESS_HOMESERVERS: localhost
      LIVEKIT_AS_REGISTRATION_FILE: /run/synapse/rtc-appservice.yaml
      LIVEKIT_HS_SERVER_NAME: localhost
      LIVEKIT_CS_API_URL_OVERRIDES: localhost=http://synapse:8008
      LIVEKIT_JWT_BIND: ":8080"
    volumes:
      - ../.local/rtc/secret:/run/rtc/secret:ro
      - ../.local/synapse/rtc-appservice.yaml:/run/synapse/rtc-appservice.yaml:ro
    depends_on:
      synapse:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ../services/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - synapse
    networks:
      internal:
        aliases:
          - xplink.localhost

volumes:
  postgres-data:

networks:
  internal:
    internal: false
