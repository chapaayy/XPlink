name: Bootstrap stage 4 dependencies and file index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-4-matrixrtc-livekit
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write .
      - run: pnpm docs:generate
      - name: Commit updated lockfile and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(stage-4): lock verified RTC dependencies, format and generate index'
            git push origin feat/stage-4-matrixrtc-livekit
          fi
