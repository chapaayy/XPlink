name: Prepare locked stage-1 dependencies
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-1-e2ee-foundation
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write .
      - run: pnpm docs:generate
      - name: Commit generated lockfile and formatting once
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock dependencies and apply reproducible formatting'
            git push origin feat/stage-1-e2ee-foundation
          fi
