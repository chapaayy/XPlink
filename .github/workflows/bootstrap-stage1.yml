name: Bootstrap XPlink Stage 1
on:
  push:
    branches: [feat/stage-1-e2ee-foundation]
    paths: [scripts/stage1.tar.xz.b64]
permissions:
  contents: write
jobs:
  unpack-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-1-e2ee-foundation
          persist-credentials: true
      - name: Extract source bundle
        run: |
          base64 -d scripts/stage1.tar.xz.b64 | tar -xJf -
          rm scripts/stage1.tar.xz.b64
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and lock dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format code and refresh file registry
        run: |
          pnpm exec prettier --write .
          pnpm docs:generate
      - name: Commit complete implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement XPlink stage 1 E2EE foundation'
          git push origin feat/stage-1-e2ee-foundation
